plugins {
    id 'com.android.application'
}
android {
    namespace 'com.autoconfirm.smsforwarder'
    compileSdk 33
    defaultConfig {
        applicationId "com.autoconfirm.smsforwarder"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "1.2"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
}
